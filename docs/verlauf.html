<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lichess classic</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    overflow-x: hidden;
    max-width: 100%;
    touch-action: pan-y;
  }
  body {
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem 0.5rem;
  }
  .wrapper {
    display: inline-block;
    text-align: left;
    width: 700px;
    max-width: calc(100vw - 1rem);
  }
  h1 {
    font-size: 22px;
    font-weight: normal;
    color: #dddddd;
    margin-bottom: 0;
    white-space: nowrap;
  }
  .updated {
    font-size: 16px;
    color: #dddddd;
    white-space: nowrap;
  }
  .chart-container {
    position: relative;
    height: 60vh;
    min-height: 350px;
    margin-top: 2rem;
  }
  .hint {
    color: #555555;
    font-size: 13px;
    text-align: center;
    margin-top: 1rem;
  }
  .rangebtn {
    background: #2a2a2a;
    color: #cccccc;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 0.4rem 0.9rem;
    font-size: 13px;
    cursor: pointer;
    font-family: Arial, sans-serif;
  }
  .rangebtn:hover {
    background: #3a3a3a;
  }
  .rangebtn.active {
    background: #0075FA;
    color: #ffffff;
    border-color: #0075FA;
  }
  .legenditem {
    display: flex;
    align-items: center;
    gap: 0.35em;
    cursor: pointer;
    font-size: 12px;
    color: #cccccc;
    user-select: none;
  }
  .legenditem.dimmed {
    color: #555555;
  }
  .legendswatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
  @media (min-width: 601px) {
    .wrapper {
      padding-left: 1em;
      padding-right: 1em;
    }
  }
  @media (max-width: 600px) {
    h1 {
      font-size: 19px;
    }
    .updated {
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem;width:100%;gap:1rem;">
    <h1><a href="https://github.com/akabeka-git/lichess_ratings_online/actions/workflows/update.yml" target="_blank" style="color:inherit;text-decoration:none;">&nbsp;&nbsp;&nbsp;lichess classic</a></h1>
    <div style="text-align:right;">
      <div class="updated">6. Oktober 20:35 Uhr</div>
      <div style="font-size:12px;margin-top:2px;">
        <a href="index.html" style="color:#555555;text-decoration:none;">alle</a>
        <span style="color:#555555;"> · </span>
        <a href="stabil.html" style="color:#555555;text-decoration:none;">stabil</a>
        <span style="color:#555555;"> · </span>
        <a href="nobots.html" style="color:#555555;text-decoration:none;">nobots</a>
        <span style="color:#555555;"> · </span>
        <a href="verlauf.html" style="color:#dddddd;text-decoration:none;">verlauf</a>
        <span style="color:#555555;"> · </span>
        <a href="play.html" style="color:#555555;text-decoration:none;">play</a>
      </div>
    </div>
  </div>
  <div class="chart-container">
    <canvas id="ratingChart"></canvas>
  </div>
  <div style="text-align:center;margin-top:1rem;display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;">
    <button class="rangebtn" data-days="0">Alles</button>
    <button class="rangebtn" data-days="365">1 Jahr</button>
    <button class="rangebtn" data-days="180">6 Monate</button>
    <button class="rangebtn" data-days="90">3 Monate</button>
    <button class="rangebtn active" data-days="30">1 Monat</button>
    <button class="rangebtn" data-days="7">1 Woche</button>
  </div>
  <div id="customLegend" style="text-align:center;margin-top:1rem;display:flex;flex-wrap:wrap;justify-content:center;gap:0.6rem;"></div>
  <div class="hint">Legende antippen blendet einzelne Spieler aus &middot; Ziehen zum Zoomen</div>
</div>
<script>
  const ctx = document.getElementById('ratingChart').getContext('2d');
  const initialFrom = new Date();
  initialFrom.setDate(initialFrom.getDate() - 30);
  const initialTo = new Date();
  const ratingChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {label:'MKlochko',data:[],borderColor:'hsl(0, 70%, 60%)',backgroundColor:'hsl(0, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'Vyacheslav-77',data:[],borderColor:'hsl(18, 70%, 60%)',backgroundColor:'hsl(18, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'Petr_Popov',data:[],borderColor:'hsl(36, 70%, 60%)',backgroundColor:'hsl(36, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'RusikTMB68',data:[],borderColor:'hsl(54, 70%, 60%)',backgroundColor:'hsl(54, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'botfather-s',data:[],borderColor:'hsl(72, 70%, 60%)',backgroundColor:'hsl(72, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[],hidden:false},
    {label:'ShadowZR2024',data:[],borderColor:'hsl(90, 70%, 60%)',backgroundColor:'hsl(90, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'jabid1907',data:[],borderColor:'hsl(108, 70%, 60%)',backgroundColor:'hsl(108, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'AliBobo21022812',data:[],borderColor:'hsl(126, 70%, 60%)',backgroundColor:'hsl(126, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'MariMango',data:[],borderColor:'hsl(144, 70%, 60%)',backgroundColor:'hsl(144, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'danifera',data:[],borderColor:'hsl(162, 70%, 60%)',backgroundColor:'hsl(162, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'aleksik58',data:[],borderColor:'hsl(180, 70%, 60%)',backgroundColor:'hsl(180, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'pion-panique',data:[],borderColor:'hsl(198, 70%, 60%)',backgroundColor:'hsl(198, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[],hidden:false},
    {label:'knifemaker73',data:[],borderColor:'hsl(216, 70%, 60%)',backgroundColor:'hsl(216, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'ulya0317',data:[],borderColor:'hsl(234, 70%, 60%)',backgroundColor:'hsl(234, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'Otto4711',data:[],borderColor:'hsl(252, 70%, 60%)',backgroundColor:'hsl(252, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'HaythamIbrahim',data:[],borderColor:'hsl(270, 70%, 60%)',backgroundColor:'hsl(270, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'eliass005',data:[],borderColor:'hsl(288, 70%, 60%)',backgroundColor:'hsl(288, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'stusharp16',data:[],borderColor:'hsl(306, 70%, 60%)',backgroundColor:'hsl(306, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'Danielostry',data:[],borderColor:'hsl(324, 70%, 60%)',backgroundColor:'hsl(324, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'cwr4356',data:[],borderColor:'hsl(342, 70%, 60%)',backgroundColor:'hsl(342, 70%, 60%)',borderWidth:2,pointRadius:0,tension:0.1,borderDash:[2,3],hidden:true},
    {label:'1600',data:[{x:'2026-01-01',y:1600}, {x:'2030-01-01',y:1600}],borderColor:'#777777',backgroundColor:'#777777',borderWidth:1,pointRadius:0,tension:0,borderDash:[],hidden:false},
    {label:'1800',data:[{x:'2026-01-01',y:1800}, {x:'2030-01-01',y:1800}],borderColor:'#777777',backgroundColor:'#777777',borderWidth:1,pointRadius:0,tension:0,borderDash:[],hidden:false}
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month' },
          min: initialFrom,
          max: initialTo,
          ticks: {
            color: '#888888',
            callback: function(value) {
              const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
              const d = new Date(value);
              return monthNames[d.getMonth()];
            }
          },
          grid: { color: '#2a2a2a' }
        },
        y: {
          ticks: { color: '#888888' },
          grid: { color: '#2a2a2a' }
        }
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          mode: 'nearest',
          intersect: false
        },
        zoom: {
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            drag: { enabled: true, modifierKey: null },
            mode: 'x'
          },
          pan: { enabled: true, mode: 'x' }
        }
      }
    }
  });

  document.querySelectorAll('.rangebtn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.rangebtn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const days = parseInt(btn.dataset.days, 10);
      if (days === 0) {
        ratingChart.options.scales.x.min = new Date('2026-01-01');
        ratingChart.options.scales.x.max = new Date();
      } else {
        const now = new Date();
        const from = new Date();
        from.setDate(now.getDate() - days);
        ratingChart.options.scales.x.min = from;
        ratingChart.options.scales.x.max = now;
      }
      ratingChart.update();
    });
  });

  const legendData = [
    {name:'MKlochko',color:'hsl(0, 70%, 60%)',hidden:true},
    {name:'Vyacheslav-77',color:'hsl(18, 70%, 60%)',hidden:true},
    {name:'Petr_Popov',color:'hsl(36, 70%, 60%)',hidden:true},
    {name:'RusikTMB68',color:'hsl(54, 70%, 60%)',hidden:true},
    {name:'botfather-s',color:'hsl(72, 70%, 60%)',hidden:false},
    {name:'ShadowZR2024',color:'hsl(90, 70%, 60%)',hidden:true},
    {name:'jabid1907',color:'hsl(108, 70%, 60%)',hidden:true},
    {name:'AliBobo21022812',color:'hsl(126, 70%, 60%)',hidden:true},
    {name:'MariMango',color:'hsl(144, 70%, 60%)',hidden:true},
    {name:'danifera',color:'hsl(162, 70%, 60%)',hidden:true},
    {name:'aleksik58',color:'hsl(180, 70%, 60%)',hidden:true},
    {name:'pion-panique',color:'hsl(198, 70%, 60%)',hidden:false},
    {name:'knifemaker73',color:'hsl(216, 70%, 60%)',hidden:true},
    {name:'ulya0317',color:'hsl(234, 70%, 60%)',hidden:true},
    {name:'Otto4711',color:'hsl(252, 70%, 60%)',hidden:true},
    {name:'HaythamIbrahim',color:'hsl(270, 70%, 60%)',hidden:true},
    {name:'eliass005',color:'hsl(288, 70%, 60%)',hidden:true},
    {name:'stusharp16',color:'hsl(306, 70%, 60%)',hidden:true},
    {name:'Danielostry',color:'hsl(324, 70%, 60%)',hidden:true},
    {name:'cwr4356',color:'hsl(342, 70%, 60%)',hidden:true}
  ];
  const visKey = "lichess_verlauf_visibility";
  let savedVis = {};
  try {
    const raw = localStorage.getItem(visKey);
    savedVis = raw ? JSON.parse(raw) : {};
  } catch (e) {}

  function saveVisibility() {
    const state = {};
    legendData.forEach(function(item, idx) {
      const meta = ratingChart.getDatasetMeta(idx);
      const isHidden = meta.hidden === null ? ratingChart.data.datasets[idx].hidden : meta.hidden;
      state[item.name] = !!isHidden;
    });
    try { localStorage.setItem(visKey, JSON.stringify(state)); } catch (e) {}
  }

  const legendContainer = document.getElementById('customLegend');
  legendData.forEach(function(item, idx) {
    // Gespeicherten Zustand uebernehmen, falls vorhanden (unbekannte/neue Spieler behalten Standard)
    if (Object.prototype.hasOwnProperty.call(savedVis, item.name)) {
      const wantHidden = savedVis[item.name];
      ratingChart.getDatasetMeta(idx).hidden = wantHidden;
      item.hidden = wantHidden;
    }

    const el = document.createElement('div');
    el.className = 'legenditem' + (item.hidden ? ' dimmed' : '');
    el.innerHTML = "<span class='legendswatch' style='background:" + item.color + ";'></span>" + item.name;
    el.addEventListener('click', function() {
      const meta = ratingChart.getDatasetMeta(idx);
      const currentlyHidden = meta.hidden === null ? ratingChart.data.datasets[idx].hidden : meta.hidden;
      meta.hidden = !currentlyHidden;
      el.classList.toggle('dimmed', meta.hidden);
      ratingChart.update();
      saveVisibility();
    });
    legendContainer.appendChild(el);
  });
  ratingChart.update();
</script>
</body>
</html>
