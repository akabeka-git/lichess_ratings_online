<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    overflow-x: hidden;
    max-width: 100%;
    touch-action: pan-y;
  }
  body {
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 1.5rem 0.5rem;
  }
  .wrapper {
    display: inline-block;
    text-align: left;
    width: 700px;
    max-width: calc(100vw - 1rem);
  }
  h1 {
    font-size: 22px;
    font-weight: normal;
    color: #dddddd;
    margin-bottom: 0;
    white-space: nowrap;
  }
  .updated {
    font-size: 16px;
    color: #dddddd;
    white-space: nowrap;
  }
  .play-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    width: 100%;
    padding: 0.3rem 0;
  }
  .play-name {
    color: #dddddd;
    font-size: 48px;
    font-weight: bold;
    text-align: center;
  }
  .play-icon {
    display: flex;
    align-items: center;
  }
  .play-suggestion {
    color: #ffffff;
    font-size: 22px;
    text-align: center;
    width: 100%;
    margin-top: 0;
    padding-top: 0;
  }
  @media (min-width: 601px) {
    .wrapper {
      padding-left: 1em;
      padding-right: 1em;
    }
  }
  @media (max-width: 600px) {
    h1 {
      font-size: 19px;
    }
    .updated {
      font-size: 13px;
    }
    .play-name {
      font-size: 28px;
    }
    .play-suggestion {
      font-size: 19px;
    }
  }
</style>
</head>
