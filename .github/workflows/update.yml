name: Update Lichess Ratings

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: lichess-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Create docs directory if missing
        run: mkdir -p docs

      - name: Run Lichess tracker
        env:
          LICHESS_TOKEN_TRIC:      ${{ secrets.LICHESS_TOKEN_TRIC }}
          LICHESS_TOKEN_PION:      ${{ secrets.LICHESS_TOKEN_PION }}
          LICHESS_TOKEN_BOTFATHER: ${{ secrets.LICHESS_TOKEN_BOTFATHER }}
          LICHESS_TOKEN_PANIC:     ${{ secrets.LICHESS_TOKEN_PANIC }}
        run: python lichess_tracker.py

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/stabil.html docs/nobots.html docs/verlauf.html docs/play.html werte.json
          git diff --staged --quiet \
            && echo "Keine Änderungen." \
            || (git commit -m "chore: update ratings $(date -u '+%Y-%m-%d %H:%M UTC')" && git pull --rebase -X theirs origin main && git push)
